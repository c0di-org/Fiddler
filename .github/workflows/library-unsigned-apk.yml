name: Library release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: library-release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          RELEASE_VERSION="$RELEASE_VERSION" node <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = process.env.RELEASE_VERSION;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          echo "Building Fiddler $RELEASE_VERSION for Library" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure Rust for Android
        run: |
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify tracked Android project
        run: |
          test -f src-tauri/gen/android/gradlew
          test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Build unsigned release APK
        run: npx tauri android build --apk --target aarch64

      - name: Verify unsigned APK
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -q "package: name='app.fiddler.desktop'"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Expected an unsigned APK, but apksigner verified it as signed." >&2
            exit 1
          fi
          mkdir -p library-artifact
          cp "$APK" library-artifact/fiddler-release-unsigned.apk

      - name: Upload unsigned APK for Library
        uses: actions/upload-artifact@v4
        with:
          name: library-unsigned-apk
          path: library-artifact/fiddler-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
