name: Regenerate app icons

on:
  push:
    branches:
      - design/app-icon-refresh

permissions:
  contents: write

jobs:
  icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/regenerate-icons.sh
      - name: Sync Cargo.lock package version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src-tauri/Cargo.lock')
          text = p.read_text()
          pattern = r'(\[\[package\]\]\nname = "fiddler"\nversion = ")[^"]+("\n)'
          text, count = re.subn(pattern, r'\g<1>0.1.4\g<2>', text, count=1)
          if count != 1:
              raise SystemExit('Could not find Fiddler package entry in Cargo.lock')
          p.write_text(text)
          PY
      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri/icons src-tauri/Cargo.lock public/apple-touch-icon.png public/favicon.ico public/favicon.svg \
            src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26 \
            src-tauri/gen/android/app/src/main/res/mipmap-mdpi \
            src-tauri/gen/android/app/src/main/res/mipmap-hdpi \
            src-tauri/gen/android/app/src/main/res/mipmap-xhdpi \
            src-tauri/gen/android/app/src/main/res/mipmap-xxhdpi \
            src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi \
            src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml
          if git diff --cached --quiet; then
            echo "Icon assets already match the source."
            exit 0
          fi
          git commit -m "Regenerate app icon assets"
          git push origin HEAD:design/app-icon-refresh
