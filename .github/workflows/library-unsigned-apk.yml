name: Library release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-release-apk
  cancel-in-progress: false

jobs:
  gate:
    name: Check Android release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare tracked version with latest Library release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Library releases are only produced from main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"

          CURRENT="$CURRENT" RELEASES="$RUNNER_TEMP/releases.json" python3 <<'PY' > "$RUNNER_TEMP/gate.env"
          import json, os, re
          current_text = os.environ["CURRENT"]
          hit = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current_text)
          if not hit:
              raise SystemExit(f"tracked version must be stable X.Y.Z for Library release: {current_text}")
          current = tuple(map(int, hit.groups()))
          versions = []
          for release in json.load(open(os.environ["RELEASES"])):
              if release.get("draft") or release.get("prerelease"):
                  continue
              tag = release.get("tag_name", "")
              match = re.fullmatch(r"android-v(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append((tuple(map(int, match.groups())), tag))
          latest_version, latest_tag = max(versions, default=((0, 0, 0), ""))
          print(f"latest={latest_tag}")
          print(f"should_release={'true' if current > latest_version else 'false'}")
          PY

          cat "$RUNNER_TEMP/gate.env" >> "$GITHUB_OUTPUT"
          . "$RUNNER_TEMP/gate.env"
          echo "Fiddler Android version: $CURRENT; latest: ${latest:-<none>}; release: $should_release" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build unsigned APK for Library
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure Rust for Android
        run: |
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify tracked Android project
        run: |
          test -f src-tauri/gen/android/gradlew
          test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Build unsigned release APK
        run: npx tauri android build --apk --target aarch64

      - name: Verify unsigned APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -q "package: name='app.fiddler.desktop'"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Expected an unsigned APK, but apksigner verified it as signed." >&2
            exit 1
          fi
          mkdir -p library-artifact
          cp "$APK" "library-artifact/fiddler-${RELEASE_VERSION}-release-unsigned.apk"

      - name: Upload unsigned APK for Library
        uses: actions/upload-artifact@v4
        with:
          name: library-unsigned-apk
          path: library-artifact/*.apk
          if-no-files-found: error
          retention-days: 7
