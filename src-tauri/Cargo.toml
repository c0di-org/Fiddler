[package]
name = "fiddler"
version = "0.1.1"
description = "A git-native file browser"
edition = "2021"
# 1.85 is mtp-rs's floor; everything else here still builds on 1.77.
rust-version = "1.85"

[lib]
name = "fiddler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
dirs = "6"
num_cpus = "1"

# Thumbnails go through the same macOS frameworks Finder uses: ImageIO for raster
# formats and QuickLookThumbnailing for everything else. Both are dramatically
# faster than decoding in-process, and Quick Look shares the system thumbnail
# cache, so files Finder has already previewed come back essentially for free.
#
# Text and PDF skip Quick Look entirely: Core Text lays out a page of source
# directly, and Core Graphics rasterises a PDF page at whatever size was asked
# for. Both are in-process and take microseconds where Quick Look takes tens of
# milliseconds and a round trip to another process.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSError", "NSFileManager"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDictionary", "CFString", "CFNumber", "CFURL", "CFAttributedString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGColor", "CGAffineTransform", "CGPDFDocument", "CGPDFPage"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "objc2-core-graphics"] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "block2", "QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "objc2-core-foundation", "objc2-core-graphics"] }

# DiskArbitration answers three questions that would otherwise need three
# different mechanisms: what is mounted and what kind of thing it is, a callback
# when a disk appears or goes away, and the eject itself. Enumerating `/Volumes`
# on a timer would cover the first, badly, and neither of the other two — and
# an unmount without it means shelling out to `diskutil` and parsing English.
#
# The `libc` feature is what makes `DADissenterGetStatus` readable, which is the
# difference between "the eject failed" and naming the app to close.
objc2-disk-arbitration = { version = "0.3", default-features = false, features = ["std", "DADisk", "DASession", "DADissenter", "libc"] }

# MTP is how a phone that isn't running Fiddler shows up: plug in a cable and
# it's there, no pairing, no app on the other end. `mtp-rs` is pure Rust over
# `nusb` — no libmtp, no libusb, no `-sys` crate — so it cross-compiles with the
# rest of the tree and adds nothing to the build beyond Rust. It also exposes the
# two primitives this UI is built on: byte-range reads, which turn a 4 MB photo
# into a 256 KB thumbnail fetch, and windowed downloads, which hand the device's
# single PTP session back between windows so browsing stays live during a copy.
#
# It needs an async runtime, but only for itself: the service owns one
# current-thread tokio runtime on a worker thread and the rest of Fiddler stays
# synchronous.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"
mtp-rs = "0.30"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures = "0.3"
bytes = "1"

# Android's PdfRenderer is part of the OS, is hardware-adjacent, and avoids
# carrying a large PDF engine in every APK. These two tiny bindings are only
# linked into the Android build to reach it from the Rust command layer.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# How full a disk is, on both platforms that have removable ones: `getmntinfo`
# and `statfs` on macOS, `statvfs` on Android. There is no framework answer to
# "how many bytes are left" — DiskArbitration doesn't know and Android's Java
# API would mean a JNI round trip per volume per poll — so both sides ask the
# kernel directly.
[target.'cfg(any(target_os = "macos", target_os = "android"))'.dependencies]
libc = "0.2"

# mtp-rs can back a device with a local directory instead of a cable, so the
# listing path, the handle cache, and the stage machine are all testable without
# a phone plugged in. Dev-only: `cargo build` never pulls this in.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
mtp-rs = { version = "0.30", features = ["virtual-device"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
